[project]
name = "research-pipeline"
version = "0.1.0"
description = "Multi-agent research pipeline built on LangGraph. Starts with a literature-search agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "arxiv>=2.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# Only needed for LLM_BACKEND=huggingface, which loads the model in-process
# instead of calling an OpenAI-compatible server. Kept out of the base
# dependencies because it drags in torch/transformers — several GB and
# thousands of inodes, which matters on a quota'd HPC home directory.
#   uv sync --extra huggingface
huggingface = [
    "langchain-huggingface>=0.1",
    "transformers>=4.44",
    "accelerate>=0.33",
    "torch>=2.4",
]

[project.scripts]
research-pipeline = "research_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
