[project]
name = "research-pipeline"
version = "0.1.0"
description = "Multi-agent research pipeline built on LangGraph. Starts with a literature-search agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "arxiv>=2.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# Only needed for LLM_BACKEND=huggingface, which loads the model in-process
# instead of calling an OpenAI-compatible server. Kept out of the base
# dependencies because it drags in torch/transformers — several GB and
# thousands of inodes, which matters on a quota'd HPC home directory.
#   uv sync --extra huggingface
huggingface = [
    "langchain-huggingface>=0.1",
    "transformers>=4.44",
    "accelerate>=0.33",
    "torch>=2.4",
]

# Only needed for `research-pipeline serve`, the web UI for starting and
# watching runs. Optional for the same reason as above: a headless SLURM sweep
# has no use for an HTTP server, and the CLI must keep working without these.
#   uv sync --extra webapp
webapp = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    # FastAPI needs this to parse the HTML form that starts a run.
    "python-multipart>=0.0.9",
]

# Only needed for CHECKPOINTER_BACKEND=sqlite, which makes a run's LangGraph
# checkpoints survive the process that wrote them. Optional for the same reason
# as the extras above: the default "memory" backend is what every graph used
# before this was configurable, and it needs nothing extra installed.
#   uv sync --extra checkpoint-sqlite
checkpoint-sqlite = [
    "langgraph-checkpoint-sqlite>=3.0",
]

# Only needed for CHECKPOINTER_BACKEND=postgres — same story as sqlite above,
# for a shared/multi-host database instead of a local file. Pulls in psycopg.
#   uv sync --extra checkpoint-postgres
checkpoint-postgres = [
    "langgraph-checkpoint-postgres>=3.0",
]

[project.scripts]
research-pipeline = "research_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_pipeline"]
# Non-Python files the web UI serves at runtime; without this they'd be left
# out of the wheel and `serve` would 500 on every page.
artifacts = [
    "src/research_pipeline/webapp/templates/**",
    "src/research_pipeline/webapp/static/**",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "mypy>=2.3",
    "pre-commit>=4.6",
]

# Lint/format/type-check config. Currently applied to the Coder Agent only —
# .pre-commit-config.yaml's per-hook `files:` regexes are what enforce that
# scope; these sections just say *how* to check whatever is in scope. The other
# five agents get the same treatment incrementally (see CLAUDE.md).

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # pycodestyle, pyflakes, import sorting, pyupgrade
# E501 (line too long) is off on purpose: `ruff format` reflows *code* to
# line-length, but never rewraps comments or docstrings — and this codebase is
# deliberately heavy on long explanatory prose comments. Leaving E501 on would
# block commits until dozens of carefully-worded comments were manually
# rewrapped, which is churn with no readability payoff.
ignore = ["E501"]

[tool.ruff.format]
# Defaults (double quotes, Black-compatible).

[tool.mypy]
python_version = "3.10"
# langgraph / langchain / arxiv / reportlab / pypdf ship no usable stubs.
ignore_missing_imports = true
# Load-bearing for the scoped rollout: without it mypy follows imports out of
# agents/coder/ into the (unannotated) rest of the package and reports a flood
# of errors nothing in scope can fix.
follow_imports = "silent"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Deliberately not strict = true — this is gradual typing, not an
# annotate-everything mandate.
